services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-marine_monitoring}
      POSTGRES_USER: ${POSTGRES_USER:-marine_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
  backend:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-marine_app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-marine_monitoring}
      UPLOAD_DIRECTORY: /data/uploads
      ARTIFACT_DIRECTORY: /data/artifacts
      BACKUP_DIRECTORY: /data/backups
    volumes: ["pilot_data:/data"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
  frontend:
    build: ./marine-monitoring-frontend
    ports: ["8080:80"]
    depends_on: [backend]
    restart: unless-stopped
  worker:
    build: .
    env_file:
      - path: .env
        required: false
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-marine_app}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-marine_monitoring}
      UPLOAD_DIRECTORY: /data/uploads
      ARTIFACT_DIRECTORY: /data/artifacts
      BACKUP_DIRECTORY: /data/backups
    volumes: ["pilot_data:/data"]
    command: ["python","scientific_event_worker.py"]
    profiles: ["worker"]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
volumes: { pilot_data: {}, postgres_data: {} }
